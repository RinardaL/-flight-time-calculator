name: Weekly data refresh

on:
  schedule:
    # Every Monday at 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Refresh holiday + exchange-rate data
        run: npm run refresh-data

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/data/enrichment.generated.json; then
            git add src/data/enrichment.generated.json
            git commit -m "chore: weekly data refresh"
            git push
          else
            echo "No data changes, skipping commit."
          fi
